<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Schedule - Fixed Colors</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 10px; background-color: #e9f0f5; }
        .controls { background: #d9edf7; padding: 10px; border-radius: 5px; margin-bottom: 5px; display: flex; align-items: center; gap: 15px; border: 1px solid #bce8f1; }
        
        table { border-collapse: collapse; width: 100%; font-size: 13px; background: white; }
        th, td { border: 1px solid #777; text-align: center; padding: 4px; height: 28px; }

        .header-main { background-color: #dcedc8; font-weight: bold; }
        .header-days { background-color: #fff9c4; }
        .header-sub { background-color: #e8f5e9; }

        /* ألوان الصفوف الأساسية */
        .row-blue { background-color: #b3e5fc; }
        .row-grey { background-color: #cfd8dc; }
        .row-orange { background-color: #ffe0b2; }
        .row-pink { background-color: #f8bbd0; }

        /* شكل الـ Annual Leave (الأخضر المطلوب) */
        .annual-leave { 
            background-color: #00c853 !important; /* لون أخضر زاهي */
            color: white !important; 
            font-weight: bold !important;
            text-transform: capitalize;
        }

        .day-off { 
            background-color: #00b0ff !important; 
            color: black !important; 
            font-weight: bold !important;
        }

        [contenteditable="true"] { outline: none; cursor: text; }
        [contenteditable="true"]:focus { background: white !important; color: black; box-shadow: inset 0 0 3px #000; }

        @media print { .controls { display: none; } body { margin: 0; } }
    </style>
</head>
<body>

<div class="controls">
    <strong>📅 Start Date:</strong>
    <input type="date" id="startDate" onchange="updateDates()" value="2025-08-08">
    <span id="rangeLabel" style="font-weight: bold; color: #31708f;">From 8 Aug To 14 Aug</span>
    <button onclick="window.print()" style="margin-left:auto; cursor:pointer;">Print / Save PDF</button>
</div>

<table id="scheduleTable">
    <thead>
        <tr class="header-main">
            <th rowspan="2">#</th>
            <th rowspan="2" style="width:150px">Name</th>
            <th rowspan="2" style="width:130px">Position</th>
            <th colspan="2" class="header-days">Saturday <div id="d0">8/Aug</div></th>
            <th colspan="2" class="header-days">Sunday <div id="d1">9/Aug</div></th>
            <th colspan="2" class="header-days">Monday <div id="d2">10/Aug</div></th>
            <th colspan="2" class="header-days">Tuesday <div id="d3">11/Aug</div></th>
            <th colspan="2" class="header-days">Wednesday <div id="d4">12/Aug</div></th>
            <th colspan="2" class="header-days">Thursday <div id="d5">13/Aug</div></th>
            <th colspan="2" class="header-days">Friday <div id="d6">14/Aug</div></th>
        </tr>
        <tr class="header-sub">
            <th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
    const data = [
        { n: "Yara Ayman", p: "Agent (Whatsapp)", s: "row-blue", d: [""] },
        { n: "Nada Serag", p: "Agent (CS)", s: "row-blue", d: [""] },
        { n: "Nagham", p: "Agent (CS)", s: "row-blue", d: [""] },
        { n: "Aya Salah", p: "Agent(Talabat)", s: "row-blue", d: [""] },
        { n: "Shereen Essam", p: "Agent", s: "row-grey", d: [""] },
        { n: "Samar Mohamed", p: "Agent", s: "row-orange", d: [""] },
        { n: "Reham Wageh", p: "Agent", s: "row-orange", d: [""] },
        { n: "Salma Mahmoud", p: "Agent", s: "row-orange", d: [""] },
        { n: "Sara Ayman", p: "Agent", s: "row-blue", d: [""] },
        { n: "Malak Soliman", p: "Agent", s: "row-pink", d: [""] },
        { n: "Ashraf Ayman", p: "Agent", s: "row-grey", d: [""] },
        { n: "Samar Sayed", p: "Agent", s: "row-blue", d: [""] },
        { n: "Hafsa Rabiaa", p: "Agent", s: "row-blue", d: [""] },
        { n: "Habiba Ahmed", p: "Agent", s: "row-orange", d: [""] },
        { n: "Karim Mamdouh", p: "Agent", s: "row-grey", d: [""] }
    ];

    function buildTable() {
        const body = document.getElementById('tableBody');
        body.innerHTML = "";
        data.forEach((item, index) => {
            let row = document.createElement('tr');
            row.className = item.s;
            let html = `<td>${index + 1}</td><td contenteditable="true">${item.n}</td><td contenteditable="true">${item.p}</td>`;
            
            let dIdx = 0;
            for (let i = 0; i < 7; i++) {
                let val = item.d[dIdx];
                if (val === "OFF") {
                    html += `<td colspan="2" class="day-off" contenteditable="true">DAY OFF</td>`;
                    dIdx++;
                } else if (val === "ANNUAL") {
                    if (item.n === "Samar Sayed" && i === 2) { 
                        html += `<td colspan="8" class="annual-leave" contenteditable="true">Annual Leave</td>`;
                        dIdx += 4; i += 3;
                    } else {
                        html += `<td colspan="2" class="annual-leave" contenteditable="true">Annual Leave</td>`;
                        dIdx++;
                    }
                } else {
                    html += `<td contenteditable="true">${item.d[dIdx] || ""}</td><td contenteditable="true">${item.d[dIdx+1] || ""}</td>`;
                    dIdx += 2;
                }
            }
            row.innerHTML = html;
            body.appendChild(row);
        });
    }

    // هذه الوظيفة تجعل أي خلية تكتب فيها كلمة ANNUAL تتحول فوراً للون الأخضر
    document.addEventListener('input', function(e) {
        if (!e.target.hasAttribute('contenteditable')) return;
        let text = e.target.innerText.toUpperCase();
        
        if (text === "ANNUAL" || text === "ANNUAL LEAVE") {
            e.target.innerText = "Annual Leave";
            e.target.className = "annual-leave";
            // دمج الخلايا تلقائياً إذا كانت خلية واحدة
            if (e.target.colSpan === 1) {
                let next = e.target.nextElementSibling;
                if (next && next.tagName === "TD") {
                    e.target.colSpan = 2;
                    next.remove();
                }
            }
        } else if (text === "OFF" || text === "DAY OFF") {
            e.target.innerText = "DAY OFF";
            e.target.className = "day-off";
            if (e.target.colSpan === 1) {
                let next = e.target.nextElementSibling;
                if (next && next.tagName === "TD") {
                    e.target.colSpan = 2;
                    next.remove();
                }
            }
        } else {
            // إذا مسح النص يرجع اللون العادي
            if (e.target.className === "annual-leave" || e.target.className === "day-off") {
                e.target.className = "";
            }
        }
    });

    function updateDates() {
        const startVal = document.getElementById('startDate').value;
        if (!startVal) return;
        let d = new Date(startVal);
        let opt = { day: 'numeric', month: 'short' };
        for (let i = 0; i < 7; i++) {
            let curr = new Date(d);
            curr.setDate(d.getDate() + i);
            document.getElementById('d' + i).innerText = curr.toLocaleDateString('en-GB', opt).replace(' ', '/');
        }
    }

    window.onload = () => { buildTable(); updateDates(); };
</script>

</body> 
</html>
