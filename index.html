<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Schedule - Exact Match</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 10px; background-color: #e9f0f5; }
        .controls { background: #d9edf7; padding: 10px; border-radius: 5px; margin-bottom: 5px; display: flex; align-items: center; gap: 15px; border: 1px solid #bce8f1; }
        
        table { border-collapse: collapse; width: 100%; font-size: 13px; background: white; }
        th, td { border: 1px solid #777; text-align: center; padding: 4px; height: 28px; }

        /* ألوان الهيدر العلوي */
        .header-main { background-color: #dcedc8; font-weight: bold; }
        .header-days { background-color: #fff9c4; }
        .header-sub { background-color: #e8f5e9; }

        /* ألوان الصفوف حسب الصورة بالضبط */
        .row-blue { background-color: #b3e5fc; } /* صفوف يارا، ندى، نغم... */
        .row-grey { background-color: #cfd8dc; } /* صفوف شيرين، أشرف، كريم */
        .row-orange { background-color: #ffe0b2; } /* صفوف سمر، ريهام، سلمى */
        .row-pink { background-color: #f8bbd0; } /* صف ملك سليمان */

        /* شكل الـ DAY OFF المطلوب (أزرق زاهي دائماً) */
        .day-off { 
            background-color: #00b0ff !important; 
            color: black !important; 
            font-weight: bold !important;
            text-align: center;
        }

        /* شكل الـ Annual Leave */
        .annual-leave { 
            background-color: #00c853 !important; 
            color: white !important; 
            font-weight: bold; 
        }

        [contenteditable="true"] { outline: none; cursor: text; }
        [contenteditable="true"]:focus { background: white !important; color: black; box-shadow: inset 0 0 3px #000; }

        @media print { .controls { display: none; } body { margin: 0; } }
    </style>
</head>
<body>

<div class="controls">
    <strong>📅 Start Date (Sat):</strong>
    <input type="date" id="startDate" onchange="updateDates()" value="2025-08-08">
    <span id="rangeLabel" style="font-weight: bold; color: #31708f;">From 8 Aug To 14 Aug</span>
    <button onclick="window.print()" style="margin-left:auto; cursor:pointer;">Print / Save PDF</button>
</div>

<table id="scheduleTable">
    <thead>
        <tr class="header-main">
            <th rowspan="2">#</th>
            <th rowspan="2" style="width:150px">name</th>
            <th rowspan="2" style="width:130px">Position</th>
            <th colspan="2" class="header-days">Saturday <div id="d0">8/Aug</div></th>
            <th colspan="2" class="header-days">Sunday <div id="d1">9/Aug</div></th>
            <th colspan="2" class="header-days">Monday <div id="d2">10/Aug</div></th>
            <th colspan="2" class="header-days">Tuesday <div id="d3">11/Aug</div></th>
            <th colspan="2" class="header-days">Wednesday <div id="d4">12/Aug</div></th>
            <th colspan="2" class="header-days">Thursday <div id="d5">13/Aug</div></th>
            <th colspan="2" class="header-days">Friday <div id="d6">14/Aug</div></th>
        </tr>
        <tr class="header-sub">
            <th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        <!-- سيتم تعبئة البيانات برمجياً لضمان الدقة -->
    </tbody>
</table>

<script>
    // البيانات الفعلية من الصورة
    const data = [
        { n: "Yara Ayman", p: "Agent (Whatsapp)", s: "row-blue", d: ["7:00", "15:00", "OFF", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00"] },
        { n: "Nada Serag", p: "Agent (CS)", s: "row-blue", d: ["7:00", "15:00", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00", "OFF"] },
        { n: "Nagham", p: "Agent (CS)", s: "row-blue", d: ["7:00", "15:00", "7:00", "15:00", "7:00", "15:00", "OFF", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00"] },
        { n: "Aya Salah", p: "Agent(Talabat)", s: "row-blue", d: ["7:00", "15:00", "7:00", "15:00", "OFF", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00"] },
        { n: "Shereen Essam", p: "Agent", s: "row-grey", d: ["10:00", "18:00", "10:00", "18:00", "10:00", "18:00", "10:00", "18:00", "10:00", "18:00", "10:00", "18:00", "OFF"] },
        { n: "Samar Mohamed", p: "Agent", s: "row-orange", d: ["8:00", "16:00", "8:00", "16:00", "8:00", "16:00", "8:00", "16:00", "8:00", "16:00", "ANNUAL", "OFF"] },
        { n: "Reham Wageh", p: "Agent", s: "row-orange", d: ["8:00", "16:00", "8:00", "16:00", "8:00", "16:00", "8:00", "16:00", "8:00", "16:00", "8:00", "16:00", "OFF"] },
        { n: "Salma Mahmoud", p: "Agent", s: "row-orange", d: ["8:00", "16:00", "8:00", "16:00", "8:00", "16:00", "8:00", "16:00", "8:00", "16:00", "ANNUAL", "OFF"] },
        { n: "Sara Ayman", p: "Agent", s: "row-blue", d: ["OFF", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00"] },
        { n: "Malak Soliman", p: "Agent", s: "row-pink", d: ["9:00", "17:00", "9:00", "17:00", "OFF", "9:00", "17:00", "9:00", "17:00", "9:00", "17:00", "8:00", "16:00"] },
        { n: "Ashraf Ayman", p: "Agent", s: "row-grey", d: ["12:30", "20:30", "12:30", "20:30", "12:30", "20:30", "12:30", "20:30", "12:30", "20:30", "OFF", "12:30", "20:30"] },
        { n: "Samar Sayed", p: "Agent", s: "row-blue", d: ["7:00", "15:00", "7:00", "15:00", "ANNUAL", "ANNUAL", "ANNUAL", "ANNUAL", "OFF"] },
        { n: "Hafsa Rabiaa", p: "Agent", s: "row-blue", d: ["7:00", "15:00", "OFF", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00", "7:00", "15:00"] },
        { n: "Habiba Ahmed", p: "Agent", s: "row-orange", d: ["8:00", "16:00", "8:00", "16:00", "8:00", "16:00", "8:00", "16:00", "8:00", "16:00", "8:00", "16:00", "8:00", "16:00"] },
        { n: "Karim Mamdouh", p: "Agent", s: "row-grey", d: ["12:30", "20:30", "12:30", "20:30", "12:30", "20:30", "12:30", "20:30", "OFF", "12:30", "20:30", "12:30", "20:30"] }
    ];

    function buildTable() {
        const body = document.getElementById('tableBody');
        body.innerHTML = "";
        data.forEach((item, index) => {
            let row = document.createElement('tr');
            row.className = item.s;
            let html = `<td>${index + 1}</td><td contenteditable="true">${item.n}</td><td contenteditable="true">${item.p}</td>`;
            
            let dIdx = 0;
            for (let i = 0; i < 7; i++) {
                let val = item.d[dIdx];
                if (val === "OFF") {
                    html += `<td colspan="2" class="day-off" contenteditable="true">DAY OFF</td>`;
                    dIdx++;
                } else if (val === "ANNUAL") {
                    // خاص لسمر سيد (الصف 12) الإجازة تمتد لعدة أيام
                    if (item.n === "Samar Sayed" && i >= 2 && i <= 5) {
                        if (i === 2) html += `<td colspan="8" class="annual-leave" contenteditable="true">Annual Leave</td>`;
                        dIdx++;
                    } else {
                        html += `<td colspan="2" class="annual-leave" contenteditable="true">Annual Leave</td>`;
                        dIdx++;
                    }
                } else {
                    html += `<td contenteditable="true">${item.d[dIdx] || ""}</td><td contenteditable="true">${item.d[dIdx+1] || ""}</td>`;
                    dIdx += 2;
                }
            }
            row.innerHTML = html;
            body.appendChild(row);
        });
    }

    function updateDates() {
        const startVal = document.getElementById('startDate').value;
        if (!startVal) return;
        let d = new Date(startVal);
        let opt = { day: 'numeric', month: 'short' };
        
        for (let i = 0; i < 7; i++) {
            let curr = new Date(d);
            curr.setDate(d.getDate() + i);
            document.getElementById('d' + i).innerText = curr.toLocaleDateString('en-GB', opt).replace(' ', '/');
        }
        
        let end = new Date(d);
        end.setDate(d.getDate() + 6);
        document.getElementById('rangeLabel').innerText = `From ${d.toLocaleDateString('en-GB', opt)} To ${end.toLocaleDateString('en-GB', opt)}`;
    }

    // ميزة تحويل النص إلى Day Off أزرق تلقائياً عند الكتابة
    document.addEventListener('input', function(e) {
        if (e.target.innerText.toUpperCase() === "OFF") {
            e.target.innerText = "DAY OFF";
            e.target.classList.add('day-off');
            // إذا كانت خلية واحدة، نجعلها تأخذ مساحة الخليتين
            if (e.target.colSpan === 1) {
                let next = e.target.nextElementSibling;
                if (next) {
                    e.target.colSpan = 2;
                    next.remove();
                }
            }
        }
    });

    window.onload = () => { buildTable(); updateDates(); };
</script>

</body>
</html>
