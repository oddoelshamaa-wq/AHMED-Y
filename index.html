<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Work Schedule</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 10px; background-color: #e9f0f5; }
        .controls { background: #d9edf7; padding: 10px; border-radius: 5px; margin-bottom: 5px; display: flex; align-items: center; gap: 15px; border: 1px solid #bce8f1; flex-wrap: wrap; }
        
        table { border-collapse: collapse; width: 100%; font-size: 13px; background: white; table-layout: fixed; }
        th, td { border: 1px solid #777; text-align: center; padding: 4px; height: 28px; overflow: hidden; position: relative; }

        .header-main { background-color: #dcedc8; font-weight: bold; }
        .header-days { background-color: #fff9c4; font-size: 11px; }
        .header-sub { background-color: #e8f5e9; font-size: 10px; }

        .row-blue { background-color: #b3e5fc; }
        .row-grey { background-color: #cfd8dc; }
        .row-orange { background-color: #ffe0b2; }
        .row-pink { background-color: #f8bbd0; }
        .row-new { background-color: #ffffff; }

        .annual-leave { background-color: #00c853 !important; color: white !important; font-weight: bold !important; font-size: 10px; text-transform: uppercase; }
        .day-off { background-color: #00b0ff !important; color: black !important; font-weight: bold !important; font-size: 10px; text-transform: uppercase; }

        [contenteditable="true"] { outline: none; cursor: text; }
        [contenteditable="true"]:focus { background: #fffde7 !important; color: black; box-shadow: inset 0 0 5px #000; }

        .btn-clear { background-color: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-add { background-color: #4caf50; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-delete { background-color: transparent; color: #f44336; border: none; cursor: pointer; font-weight: bold; font-size: 16px; padding: 0; }
        .btn-delete:hover { color: black; }

        #syncIndicator { font-size: 12px; font-weight: bold; padding: 5px; border-radius: 4px; }
        .synced { color: #2e7d32; }

        @media print { .controls, .btn-delete, .col-action { display: none !important; } table { width: 100%; } }
        #leavesPage table th, #leavesPage table td { border: 1px solid #ddd; padding: 12px; text-align: center; }
#leavesPage table tr:nth-child(even) { background-color: #f9f9f9; }
/* تصميم النافذة المنبثقة (Modal) */
.modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;
}
.modal-content {
    background: white; padding: 25px; border-radius: 15px; width: 350px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: right; direction: rtl;
    animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-content h3 { margin-top: 0; color: #37474f; border-bottom: 2px solid #2196F3; padding-bottom: 10px; }
.input-group { margin: 15px 0; }
.input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
.input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
.modal-btns { display: flex; gap: 10px; margin-top: 20px; }
.btn-save { background: #2196F3; color: white; border: none; flex: 2; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
.btn-cancel { background: #eee; color: #333; border: none; flex: 1; padding: 10px; border-radius: 8px; cursor: pointer; }
.btn-save:hover { background: #1976D2; }
    </style>
</head>
<body>
<div style="margin-bottom: 10px;">
    <button onclick="showPage('schedule')" id="btnSched" style="padding: 10px 20px; cursor: pointer; background: #2196F3; color: white; border: none; border-radius: 5px;">جدول العمل</button>
    <button onclick="showPage('leaves')" id="btnLeaves" style="padding: 10px 20px; cursor: pointer; background: #cfd8dc; border: none; border-radius: 5px;">عداد السنوي</button>
</div>  
<div class="controls">
    <strong>📅 Start Date:</strong>
    <input type="date" id="startDate" onchange="updateDatesAndSave()" value="2025-08-08">
    <span id="rangeLabel" style="font-weight: bold; color: #31708f;"></span>
    <div id="syncIndicator" class="synced">Cloud Connected ✅</div>
    
    <button onclick="addNewRow()" class="btn-add">+ Add Employee</button>
    <button onclick="window.print()" style="margin-left:auto; cursor:pointer; padding: 5px 15px;">Print</button>
    <button onclick="resetTable()" class="btn-clear">Reset All</button>
</div>

<table id="scheduleTable">
    <thead>
        <tr class="header-main">
            <th rowspan="2" style="width:30px">#</th>
            <th rowspan="2" style="width:130px">Name</th>
            <th rowspan="2" style="width:110px">Position</th>
            <th colspan="2" class="header-days">Saturday <div id="d0"></div></th>
            <th colspan="2" class="header-days">Sunday <div id="d1"></div></th>
            <th colspan="2" class="header-days">Monday <div id="d2"></div></th>
            <th colspan="2" class="header-days">Tuesday <div id="d3"></div></th>
            <th colspan="2" class="header-days">Wednesday <div id="d4"></div></th>
            <th colspan="2" class="header-days">Thursday <div id="d5"></div></th>
            <th colspan="2" class="header-days">Friday <div id="d6"></div></th>
            <th rowspan="2" class="col-action" style="width:40px">Action</th>
        </tr>
        <tr class="header-sub">
            <th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>
<div id="leavesPage" style="display: none; background: white; padding: 20px; border-radius: 8px; border: 1px solid #ccc;">
    <h2 style="text-align: center;">إحصائيات الإجازات السنوية</h2>
    <table style="width: 70%; margin: 0 auto; border-collapse: collapse;">
        <thead>
            <tr style="background: #37474f; color: white;">
                <th>اسم الموظف</th>
      <th>المستخدم</th>
        <th>المتبقي</th>
        <th>تعديل</th>
            
            </tr>
        </thead>
        <tbody id="leavesTableBody">
            <!-- البيانات ستظهر هنا برمجياً -->
        </tbody>
    </table>
</div>
<!-- نافذة التعديل الجديدة -->
<div id="editModal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modalTitle">تعديل بيانات الموظف</h3>
        <div class="input-group">
            <label>الرصيد السنوي الكلي:</label>
            <input type="number" id="inputTotal" placeholder="مثلاً: 21">
        </div>
        <div class="input-group">
            <label>أيام مستخدمة سابقاً:</label>
            <input type="number" id="inputManual" placeholder="خارج هذا الجدول">
        </div>
        <div class="modal-btns">
            <button class="btn-save" onclick="saveModalData()">حفظ التغييرات ✅</button>
            <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA6exXjSwQCxpi1exR4HBXxOEeO_r34jOQ",
        authDomain: "studio-8662573251-95f15.firebaseapp.com",
        projectId: "studio-8662573251-95f15",
        storageBucket: "studio-8662573251-95f15.firebasestorage.app",
        messagingSenderId: "781647119963",
        appId: "1:781647119963:web:5a7d5ee83e0916da0ee17e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const docRef = db.collection("work_schedules").doc("global_live_data");

    function createRowHtml(index, name = "", position = "", rowClass = "row-new") {
        let cells = "";
        for (let i = 0; i < 14; i++) {
            cells += `<td contenteditable="true"></td>`;
        }
        return `
            <tr class="${rowClass}">
                <td class="row-index">${index}</td>
                <td contenteditable="true">${name}</td>
                <td contenteditable="true">${position}</td>
                ${cells}
                <td class="col-action"><button class="btn-delete" onclick="deleteRow(this)">❌</button></td>
            </tr>`;
    }

    function addNewRow() {
        const body = document.getElementById('tableBody');
        const index = body.rows.length + 1;
        body.insertAdjacentHTML('beforeend', createRowHtml(index));
        saveToCloud();
    }

    function deleteRow(btn) {
        if(confirm("Delete this employee?")) {
            btn.closest('tr').remove();
            reIndexRows();
            saveToCloud();
        }
    }

    function reIndexRows() {
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach((row, idx) => {
            row.querySelector('.row-index').innerText = idx + 1;
        });
    }

    let debounceTimer;
    function saveToCloud() {
        document.getElementById('syncIndicator').innerText = "Saving... ⏳";
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            docRef.set({
                content: document.getElementById('tableBody').innerHTML,
                startDate: document.getElementById('startDate').value
            }).then(() => {
                document.getElementById('syncIndicator').innerText = "All Saved ✅";
            });
        }, 1000); 
    }

    document.addEventListener('input', function(e) {
        if (!e.target.hasAttribute('contenteditable')) return;
        
        let cell = e.target;
        let text = cell.innerText.trim().toUpperCase();

        // Auto shift conversion
        const shifts = { "7":"15:00", "8":"16:00", "9":"17:00", "10":"18:00", "12":"20:00" };
        if (shifts[text]) {
            let next = cell.nextElementSibling;
            if (next && next.tagName === "TD") {
                next.innerText = shifts[text];
                if (!text.includes(":")) cell.innerText = text + ":00";
            }
        }

        // OFF and Annual handling
        if (text === "OFF" || text === "ANNUAL" || text === "A") {
            let isAnnual = text.startsWith("A");
            cell.innerText = isAnnual ? "Annual Leave" : "DAY OFF";
            cell.className = isAnnual ? "annual-leave" : "day-off";
            if (cell.colSpan === 1) {
                let next = cell.nextElementSibling;
                if (next && next.tagName === "TD") {
                    cell.colSpan = 2;
                    next.style.display = "none"; 
                }
            }
        } else if (text === "" && cell.colSpan === 2) {
            cell.colSpan = 1;
            cell.className = "";
            let next = cell.nextElementSibling;
            if (next) next.style.display = "";
        }

        saveToCloud();
    });

    function updateDates() {
        const startVal = document.getElementById('startDate').value;
        if (!startVal) return;
        let d = new Date(startVal);
        let opt = { day: 'numeric', month: 'short' };
        for (let i = 0; i < 7; i++) {
            let curr = new Date(d);
            curr.setDate(d.getDate() + i);
            document.getElementById('d' + i).innerText = curr.toLocaleDateString('en-GB', opt).replace(' ', '/');
        }
    }

    function updateDatesAndSave() { updateDates(); saveToCloud(); }

    function resetTable() {
        if(confirm("This will clear EVERYTHING. Are you sure?")) {
            document.getElementById('tableBody').innerHTML = "";
            saveToCloud();
        }
    }

    window.onload = () => {
        docRef.onSnapshot((doc) => {
            if (doc.exists && document.activeElement.tagName !== 'TD') {
                const data = doc.data();
                document.getElementById('tableBody').innerHTML = data.content;
                document.getElementById('startDate').value = data.startDate;
                updateDates();
            }
        });
    };
    // دالة التبديل بين الصفحات
function showPage(page) {
    if (page === 'schedule') {
        document.getElementById('scheduleTable').style.display = 'table';
        document.getElementById('leavesPage').style.display = 'none';
        document.getElementById('btnSched').style.background = '#2196F3';
        document.getElementById('btnSched').style.color = 'white';
        document.getElementById('btnLeaves').style.background = '#cfd8dc';
        document.getElementById('btnLeaves').style.color = 'black';
    } else {
        document.getElementById('scheduleTable').style.display = 'none';
        document.getElementById('leavesPage').style.display = 'block';
        document.getElementById('btnLeaves').style.background = '#2196F3';
        document.getElementById('btnLeaves').style.color = 'white';
        document.getElementById('btnSched').style.background = '#cfd8dc';
        document.getElementById('btnSched').style.color = 'black';
        
        // تشغيل التحديث عند فتح الصفحة
        updateLeavesStats();
    }
}

// دالة حساب الإجازات بناءً على ما هو موجود في الجدول
function updateLeavesStats() {
    const rows = document.querySelectorAll('#tableBody tr');
    const leavesBody = document.getElementById('leavesTableBody');
    leavesBody.innerHTML = ''; // مسح البيانات القديمة

    rows.forEach(row => {
        // جلب الاسم من الخلية الثانية في الصف
        let name = row.cells[1].innerText.trim();
        if (name === "") return; // تخطي الصفوف الفارغة

        // عد الخلايا التي تحتوي على كلاس 'annual-leave' في هذا الصف فقط
        let usedThisWeek = row.querySelectorAll('.annual-leave').length;
        
        // لنفرض أن الرصيد الكلي لكل موظف 21 (يمكنك تعديل هذا الرقم)
        let totalBalance = 21; 
        let remaining = totalBalance - usedThisWeek;

        // إضافة صف في جدول الإحصائيات
        leavesBody.innerHTML += `
            <tr>
                <td style="font-weight: bold;">${name}</td>
                <td style="color: #d32f2f; font-weight: bold;">${usedThisWeek} أيام</td>
                <td style="color: #2e7d32; font-weight: bold;">${remaining} يوم</td>
            </tr>
        `;
    });
}
// --- إعدادات إضافية ---
const ADMIN_PASSWORD = "1234"; // يمكنك تغيير كلمة المرور من هنا
let employeeBalances = {}; // لتخزين أرصدة الموظفين القادمة من السحاب

function saveToCloud() {
    document.getElementById('syncIndicator').innerText = "Saving... ⏳";
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
        docRef.set({
            content: document.getElementById('tableBody').innerHTML,
            startDate: document.getElementById('startDate').value,
            balances: employeeBalances // إضافة هذا السطر لحفظ الأرصدة
        }).then(() => {
            document.getElementById('syncIndicator').innerText = "All Saved ✅";
        });
    }, 1000); 
}

window.onload = () => {
    docRef.onSnapshot((doc) => {
        if (doc.exists && document.activeElement.tagName !== 'TD') {
            const data = doc.data();
            document.getElementById('tableBody').innerHTML = data.content;
            document.getElementById('startDate').value = data.startDate;
            employeeBalances = data.balances || {}; // تحميل الأرصدة المخزنة
            updateDates();
        }
    });
};

// دالة حساب الإجازات وتعديل الرصيد
function updateLeavesStats() {
    const rows = document.querySelectorAll('#tableBody tr');
    const leavesBody = document.getElementById('leavesTableBody');
    leavesBody.innerHTML = ''; 

    rows.forEach(row => {
        let name = row.cells[1].innerText.trim();
        if (name === "" || name === "Name") return; 

        let usedThisWeek = row.querySelectorAll('.annual-leave').length;
        
        // جلب بيانات الموظف (الرصيد الكلي والمستخدم سابقاً)
        let data = employeeBalances[name] || { total: 21, manualUsed: 0 };
        
        // حساب الإجمالي
        let totalUsed = usedThisWeek + (parseInt(data.manualUsed) || 0);
        let remaining = (parseInt(data.total) || 21) - totalUsed;

        leavesBody.innerHTML += `
            <tr>
                <td style="font-weight: bold;">${name}</td>
                <td style="color: #d32f2f; font-weight: bold;">
                    ${totalUsed} أيام 
                    <small style="color:gray; display:block; font-size:9px;">(${usedThisWeek} حالي + ${data.manualUsed || 0} سابق)</small>
                </td>
                <td style="color: #2e7d32; font-weight: bold;">${remaining} يوم</td>
                <td><button onclick="editBalancePrompt('${name}')" style="cursor:pointer; padding:2px 5px;">تعديل ⚙️</button></td>
            </tr>
        `;
    });
}

// دالة تعديل الرصيد بكلمة مرور
let currentEditingEmployee = "";

// تفتح النافذة بعد التأكد من الباسورد
function editBalancePrompt(employeeName) {
    let pass = prompt("أدخل كلمة المرور للدخول لوضع التعديل:");
    
    if (pass === ADMIN_PASSWORD) {
        currentEditingEmployee = employeeName;
        let current = employeeBalances[employeeName] || { total: 21, manualUsed: 0 };
        
        // تعبئة البيانات الحالية في النافذة
        document.getElementById('modalTitle').innerText = "تعديل: " + employeeName;
        document.getElementById('inputTotal').value = current.total;
        document.getElementById('inputManual').value = current.manualUsed;
        
        // إظهار النافذة
        document.getElementById('editModal').style.display = 'flex';
    } else if (pass !== null) {
        alert("كلمة المرور خاطئة!");
    }
}

function closeModal() {
    document.getElementById('editModal').style.display = 'none';
}

function saveModalData() {
    let total = document.getElementById('inputTotal').value;
    let manual = document.getElementById('inputManual').value;

    if (total === "" || manual === "") {
        alert("يرجى ملء جميع الخانات");
        return;
    }

    // حفظ البيانات
    employeeBalances[currentEditingEmployee] = {
        total: parseInt(total),
        manualUsed: parseInt(manual)
    };

    saveToCloud(); // حفظ في Firebase
    closeModal();
    setTimeout(updateLeavesStats, 500); // تحديث الجدول
    alert("تم تحديث بيانات " + currentEditingEmployee + " بنجاح ✨");
}
</script>

</body>
</html>
