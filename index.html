<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Work Schedule</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 10px; background-color: #e9f0f5; }
        .controls { background: #d9edf7; padding: 10px; border-radius: 5px; margin-bottom: 5px; display: flex; align-items: center; gap: 15px; border: 1px solid #bce8f1; flex-wrap: wrap; }
        
        table { border-collapse: collapse; width: 100%; font-size: 13px; background: white; table-layout: fixed; }
        th, td { border: 1px solid #777; text-align: center; padding: 4px; height: 28px; overflow: hidden; position: relative; }

        .header-main { background-color: #dcedc8; font-weight: bold; }
        .header-days { background-color: #fff9c4; font-size: 11px; }
        .header-sub { background-color: #e8f5e9; font-size: 10px; }

        .row-blue { background-color: #b3e5fc; }
        .row-grey { background-color: #cfd8dc; }
        .row-orange { background-color: #ffe0b2; }
        .row-pink { background-color: #f8bbd0; }
        .row-new { background-color: #ffffff; }

        .annual-leave { background-color: #00c853 !important; color: white !important; font-weight: bold !important; font-size: 10px; text-transform: uppercase; }
        .day-off { background-color: #00b0ff !important; color: black !important; font-weight: bold !important; font-size: 10px; text-transform: uppercase; }

        [contenteditable="true"] { outline: none; cursor: text; }
        [contenteditable="true"]:focus { background: #fffde7 !important; color: black; box-shadow: inset 0 0 5px #000; }

        .btn-clear { background-color: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-add { background-color: #4caf50; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-delete { background-color: transparent; color: #f44336; border: none; cursor: pointer; font-weight: bold; font-size: 16px; padding: 0; }
        .btn-delete:hover { color: black; }

        #syncIndicator { font-size: 12px; font-weight: bold; padding: 5px; border-radius: 4px; }
        .synced { color: #2e7d32; }

        @media print { .controls, .btn-delete, .col-action { display: none !important; } table { width: 100%; } }
    </style>
</head>
<body>

<div class="controls">
    <strong>📅 Start Date:</strong>
    <input type="date" id="startDate" onchange="updateDatesAndSave()" value="2025-08-08">
    <span id="rangeLabel" style="font-weight: bold; color: #31708f;"></span>
    <div id="syncIndicator" class="synced">Cloud Connected ✅</div>
    
    <button onclick="addNewRow()" class="btn-add">+ Add Employee</button>
    <button onclick="window.print()" style="margin-left:auto; cursor:pointer; padding: 5px 15px;">Print</button>
    <button onclick="resetTable()" class="btn-clear">Reset All</button>
</div>

<table id="scheduleTable">
    <thead>
        <tr class="header-main">
            <th rowspan="2" style="width:30px">#</th>
            <th rowspan="2" style="width:130px">Name</th>
            <th rowspan="2" style="width:110px">Position</th>
            <th colspan="2" class="header-days">Saturday <div id="d0"></div></th>
            <th colspan="2" class="header-days">Sunday <div id="d1"></div></th>
            <th colspan="2" class="header-days">Monday <div id="d2"></div></th>
            <th colspan="2" class="header-days">Tuesday <div id="d3"></div></th>
            <th colspan="2" class="header-days">Wednesday <div id="d4"></div></th>
            <th colspan="2" class="header-days">Thursday <div id="d5"></div></th>
            <th colspan="2" class="header-days">Friday <div id="d6"></div></th>
            <th rowspan="2" class="col-action" style="width:40px">Action</th>
        </tr>
        <tr class="header-sub">
            <th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th><th>From</th><th>To</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA6exXjSwQCxpi1exR4HBXxOEeO_r34jOQ",
        authDomain: "studio-8662573251-95f15.firebaseapp.com",
        projectId: "studio-8662573251-95f15",
        storageBucket: "studio-8662573251-95f15.firebasestorage.app",
        messagingSenderId: "781647119963",
        appId: "1:781647119963:web:5a7d5ee83e0916da0ee17e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const docRef = db.collection("work_schedules").doc("global_live_data");

    function createRowHtml(index, name = "", position = "", rowClass = "row-new") {
        let cells = "";
        for (let i = 0; i < 14; i++) {
            cells += `<td contenteditable="true"></td>`;
        }
        return `
            <tr class="${rowClass}">
                <td class="row-index">${index}</td>
                <td contenteditable="true">${name}</td>
                <td contenteditable="true">${position}</td>
                ${cells}
                <td class="col-action"><button class="btn-delete" onclick="deleteRow(this)">❌</button></td>
            </tr>`;
    }

    function addNewRow() {
        const body = document.getElementById('tableBody');
        const index = body.rows.length + 1;
        body.insertAdjacentHTML('beforeend', createRowHtml(index));
        saveToCloud();
    }

    function deleteRow(btn) {
        if(confirm("Delete this employee?")) {
            btn.closest('tr').remove();
            reIndexRows();
            saveToCloud();
        }
    }

    function reIndexRows() {
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach((row, idx) => {
            row.querySelector('.row-index').innerText = idx + 1;
        });
    }

    let debounceTimer;
    function saveToCloud() {
        document.getElementById('syncIndicator').innerText = "Saving... ⏳";
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            docRef.set({
                content: document.getElementById('tableBody').innerHTML,
                startDate: document.getElementById('startDate').value
            }).then(() => {
                document.getElementById('syncIndicator').innerText = "All Saved ✅";
            });
        }, 1000); 
    }

    document.addEventListener('input', function(e) {
        if (!e.target.hasAttribute('contenteditable')) return;
        
        let cell = e.target;
        let text = cell.innerText.trim().toUpperCase();

        // Auto shift conversion
        const shifts = { "7":"15:00", "8":"16:00", "9":"17:00", "10":"18:00", "12":"20:00" };
        if (shifts[text]) {
            let next = cell.nextElementSibling;
            if (next && next.tagName === "TD") {
                next.innerText = shifts[text];
                if (!text.includes(":")) cell.innerText = text + ":00";
            }
        }

        // OFF and Annual handling
        if (text === "OFF" || text === "ANNUAL" || text === "A") {
            let isAnnual = text.startsWith("A");
            cell.innerText = isAnnual ? "Annual Leave" : "DAY OFF";
            cell.className = isAnnual ? "annual-leave" : "day-off";
            if (cell.colSpan === 1) {
                let next = cell.nextElementSibling;
                if (next && next.tagName === "TD") {
                    cell.colSpan = 2;
                    next.style.display = "none"; 
                }
            }
        } else if (text === "" && cell.colSpan === 2) {
            cell.colSpan = 1;
            cell.className = "";
            let next = cell.nextElementSibling;
            if (next) next.style.display = "";
        }

        saveToCloud();
    });

    function updateDates() {
        const startVal = document.getElementById('startDate').value;
        if (!startVal) return;
        let d = new Date(startVal);
        let opt = { day: 'numeric', month: 'short' };
        for (let i = 0; i < 7; i++) {
            let curr = new Date(d);
            curr.setDate(d.getDate() + i);
            document.getElementById('d' + i).innerText = curr.toLocaleDateString('en-GB', opt).replace(' ', '/');
        }
    }

    function updateDatesAndSave() { updateDates(); saveToCloud(); }

    function resetTable() {
        if(confirm("This will clear EVERYTHING. Are you sure?")) {
            document.getElementById('tableBody').innerHTML = "";
            saveToCloud();
        }
    }

    window.onload = () => {
        docRef.onSnapshot((doc) => {
            if (doc.exists && document.activeElement.tagName !== 'TD') {
                const data = doc.data();
                document.getElementById('tableBody').innerHTML = data.content;
                document.getElementById('startDate').value = data.startDate;
                updateDates();
            }
        });
    };
</script>

</body>
</html>
